name: sudoku

description: A minimal Sudoku app in Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  socket_io_client: ^3.0.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  posthog_flutter: ^5.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon for all platforms. Source art is generated by
# tool/iconfwd/generate_logo.js. Regenerate icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/logo.png"
  android: true
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1A1A1A"
    theme_color: "#1A1A1A"
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true
